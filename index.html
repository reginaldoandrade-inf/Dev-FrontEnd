<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Acadêmicas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
    </header>
<main>
   <section aria-labelledby="titulo-filtros">    
        <h2 id="titulo-filtros">Busca e Filtros</h2>

        <form>
            <label for="buscaTarefa">Buscar tarefa por título: </label>
            <input type="search" id="buscaTarefa" name="buscaTarefa">          
            
            <fieldset>
                <legend>Filtrar quadro</legend>
                <label for="status">
                    Status:
                </label>
                <select id="status" name="status">
                  <option value="todos">Todos</option>
                  <option value="a-fazer">A Fazer</option>
                  <option value="em-andamento">Em Andamento</option>
                  <option value="em-revisao">Em Revisão</option>
                  <option value="concluida">Concluída</option>
                </select>
                                
                <label for="prioridade">
                  Prioridade:
                </label>
                <select id="prioridade" name="prioridade">
                  <option value="todas">Todas</option>
                  <option value="baixa">Baixa</option>
                  <option value="media">Média</option>
                  <option value="alta">Alta</option>
                </select>                               

                <button type="submit">Filtrar</button>
            </fieldset>
        </form>
    </section>

    <!-- Região de Status acessível (role="status" aria-live="polite") inicialmente vazia -->
    <div id="regiao-status" role="status" aria-live="polite"></div>
    
    <section aria-labelledby="titulo-quadro">
      <h2 id="titulo-quadro">Quadro de Tarefas</h2>

      <section aria-labelledby="status-a-fazer">
        <h3 id="status-a-fazer">A Fazer</h3>
        <ul data-lista-status="a-fazer"></ul>
      </section>
      
      <section aria-labelledby="status-em-andamento">
        <h3 id="status-em-andamento">Em Andamento</h3>
        <ul data-lista-status="em-andamento"></ul>
      </section>

      <section aria-labelledby="status-em-revisao">
        <h3 id="status-em-revisao">Em Revisão</h3>
        <ul data-lista-status="em-revisao"></ul>
      </section>
      
      <section aria-labelledby="status-concluida">
        <h3 id="status-concluida">Concluída</h3>
        <ul data-lista-status="concluida"></ul>
      </section>

    </section>

</main>

<footer>
    <p><b>Aluno:</b> Reginaldo Santos Andrade</p>
    <p>Desenvolvimento Front-End</p>    
</footer>

<script type="module" src="./js/app.js"></script>
</body>
</html>
